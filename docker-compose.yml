version: '3.4'

services:
  db:
    container_name: mysql
    logging:
      driver: json-file
      options:
        max-size: 10m
    image: mysql:5.7
    environment:
      - MYSQL_DATABASE=bolt
      - MYSQL_USER=bolt
      - MYSQL_PASSWORD=${MASTERPASSWORD}
      - MYSQL_ROOT_PASSWORD=${MASTERPASSWORD}
    volumes:
      - db-data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
    # All ports localhost only: the server's nginx serves bolt.<url> from 3000;
    # MySQL and mailcatcher must never be reachable from outside.
    ports:
      - target: 3306
        published: 33306
        host_ip: 127.0.0.1
        protocol: tcp

  php:
    container_name: php
    logging:
      driver: json-file
      options:
        max-size: 10m
    build:
      context: ./
      target: php
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      - db
      - mailcatcher
    volumes:
      - ./:/srv/bolt:rw,cached
      - ./docker/php/conf.d/bolt.dev.ini:/usr/local/etc/php/conf.d/bolt.ini
      # if you develop on Linux, you may use a bind-mounted host directory instead
      # - ./var:/srv/bolt/var:rw

  nginx:
    container_name: nginxbolt
    logging:
      driver: json-file
      options:
        max-size: 10m
    build:
      context: ./
      target: nginx
    depends_on:
      - php
    volumes:
      - ./public:/srv/bolt/public:ro
    ports:
      - target: 80
        published: 3000
        host_ip: 127.0.0.1
        protocol: tcp

  mailcatcher:
    container_name: mailcatcher
    logging:
      driver: json-file
      options:
        max-size: 10m
    image: schickling/mailcatcher
    ports:
      - target: 1080
        published: 1080
        host_ip: 127.0.0.1
        protocol: tcp

volumes:
  db-data: {}
